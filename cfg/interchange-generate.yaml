# Inference config shared by the three tasks (A/B/C): topology-first cascade = topology stage (segment coarse-graph diffusion -> uncoarsen to adjacency A) then attribute stage (unified autoencoder/denoiser -> node attributes: coordinates + lanes + speed) under the generated topology; property-conditioned cross-attention; meter de-normalization; training-compatible JSON + _summary.csv (no figure export)
generate:
  topology_cfg: cfg/interchange-topology-diffusion.yaml          # topology stage: property-conditioned segment coarse-graph diffusion (segment connectivity W + length/type L)
  topology_ckpt: results/interchange-topology-diffusion/0/ckpt/9.ckpt # topology weights; the inference dataset must be preprocessed with segment.enable=True (the generate scripts force this)
  attribute_cfg: cfg/interchange-attribute-diffusion.yaml        # attribute stage: property-conditioned attribute diffusion generating coordinates + lanes + speed jointly given the adjacency
  attribute_ckpt: results/interchange-attribute-diffusion/0/ckpt/9.ckpt # attribute weights (attribute autoencoder + denoiser)
  targets: [[21000, 15000], [25000, 12000], [30000, 18000]]      # (cost, throughput) target grid (percentile conditions drawn from the four-leg subset)
  total_per_target: 20        # samples per target (task A = number generated; tasks B/C = samples K per anchor per target, overridable by --k)
  topk_pool: 200              # task A: use Top-K reference graphs only as coarse-graph size-M seeds (adjacency is generated by the topology diffusion, not copied)
  pool_metric: rel_chebyshev  # reference-pool metric: rel_chebyshev = minimize the worse of the two axes' relative error (default) | rel_l2 = relative-error L2 | zscore_l2 = standardized L2
  pool_source: all            # reference pool source: all|train|val|test
  batch_size: 16              # inference batch size
  ddim_steps: null            # sampling steps: null = full DDPM (1000, matches training val, strongly recommended); integer = DDIM (only valid for eps parameterization; x0 diverges when subsampled)
  ddim_eta: 0.0               # DDIM stochasticity (only used when ddim_steps is not null)
  use_ddpm_steps: False       # force DDPM timesteps with DDIM update rule (experimental)
  denorm: True                # True = de-normalize to meter coordinates (recommended); False = keep normalized coordinates
  global_diag: 6014.676358    # global normalization diagonal (meta.json global_params.global_diag; identical for graph_data_all and graph_data_4direction)
  z_fill: 0.0                 # z coordinate is not modeled; output fill value
  graph_data_dir: graph_data_4direction # inference source: task A targets, task B mainline anchors, task C reference interchanges (four-leg subset)
  train_stats_dir: graph_data_all       # y_mean/y_std + cost/throughput bins from the training set (inference normalization must match training), loaded via _property_bins.json
  dataset_root: datasets/Interchange_infer # processed cache for the inference dataset (built from graph_data_4direction; keep separate from the training cache)
  out_dir: results/generated  # output root
  meta_cache: graph_data_4direction/_cond_index.npz # (id, cost, throughput, N) scan cache
  seed: 42                    # random seed
